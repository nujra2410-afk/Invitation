<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>A Little Invitation 💗</title>
  <!-- Fonts are optional: the page falls back to system cursive/sans if offline -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Floating hearts & sparkles are generated by script.js -->
  <div class="bg-layer" id="bgLayer" aria-hidden="true"></div>
  <div class="fx-layer" id="fxLayer" aria-hidden="true"></div>
  <div class="taunt" id="taunt" aria-live="polite"></div>

  <!-- SCREEN 1: invitation -->
  <section class="screen active" id="screen1">
    <div class="panel">
      <div class="big-heart" aria-hidden="true">💘</div>
      <h1 class="title">Will you go for a movie with me? ❤️</h1>
      <div class="actions">
        <button class="btn btn-yes" id="yesBtn" type="button">Yes 💗</button>
        <span class="slot"><button class="btn btn-ghost escape" id="noBtn" type="button">No 🙈</button></span>
      </div>
    </div>
  </section>

  <!-- SCREEN 2: timing -->
  <section class="screen" id="screen2">
    <div class="panel">
      <h1 class="title">Yay! ❤️ Choose Our Movie Time</h1>
      <div class="actions">
        <span class="slot"><button class="btn btn-ghost escape" type="button">🌅 Morning</button></span>
        <button class="btn btn-yes" id="afternoonBtn" type="button">☀️ Afternoon</button>
        <span class="slot"><button class="btn btn-ghost escape" type="button">🌙 Evening</button></span>
      </div>
    </div>
  </section>

  <!-- SCREEN 3: food -->
  <section class="screen" id="screen3">
    <div class="panel">
      <h1 class="title">What would you like to eat? 🍕❤️</h1>
      <div class="foods">
        <button class="food" type="button" data-food="Burger"><span class="emoji">🍔</span>Burger</button>
        <button class="food" type="button" data-food="Pizza"><span class="emoji">🍕</span>Pizza</button>
        <button class="food" type="button" data-food="KFC"><span class="emoji">🍗</span>KFC</button>
      </div>
    </div>
  </section>

  <!-- SCREEN 4: final greeting card -->
  <section class="screen" id="screen4">
    <div class="panel">
      <article class="card">
        <span class="deco d1" aria-hidden="true">🌹</span>
        <span class="deco d2" aria-hidden="true">💖</span>
        <span class="deco d3" aria-hidden="true">🌹</span>
        <span class="deco d4" aria-hidden="true">💗</span>
        <div class="seal" aria-hidden="true">💌</div>
        <p class="msg-main" id="finalMain"></p>
        <div class="divider" aria-hidden="true">❤</div>
        <p class="msg-sub">A little movie, a little food, and a lot of memories waiting to be made. ❤️</p>
      </article>
    </div>
  </section>

  <script src="script.js"></script>
</body>
</html>
